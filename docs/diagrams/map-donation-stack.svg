<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000" font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif">
<title>One donation through the stack</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55655c"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6b48"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9a"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5d0c"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b3a31"/></marker></defs>
<rect width="1560" height="1000" fill="#ffffff"/>
<text x="780" y="40" font-size="22" font-weight="700" fill="#0f3d2a" text-anchor="middle" direction="ltr">One feature through the whole stack: a donation · ميزة واحدة عبر كل الطبقات: التبرع</text><rect x="40" y="80" width="190" height="62" rx="10" fill="#c27c0e"/><text x="135" y="106" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">UI</text><text x="135" y="127" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">الواجهة</text><rect x="240" y="80" width="860" height="62" rx="10" fill="#ffffff" stroke="#c27c0e" stroke-width="1.4"/><text x="256" y="116" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">web: app/(public)/campaigns/[slug]/donate/page.tsx · mobile: src/app/pledge/[campaignId].tsx</text><path d="M135,142 L135,158" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="158" width="190" height="62" rx="10" fill="#2f5d9a"/><text x="135" y="184" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Write path</text><text x="135" y="205" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">مسار الكتابة</text><rect x="240" y="158" width="860" height="62" rx="10" fill="#ffffff" stroke="#2f5d9a" stroke-width="1.4"/><text x="256" y="194" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">web: lib/actions/donations.ts transferPledgeAction (validate → requireSessionToken) · mobile: lib/api.ts</text><path d="M135,220 L135,236" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="236" width="190" height="62" rx="10" fill="#2f5d9a"/><text x="135" y="262" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">HTTP</text><text x="135" y="283" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">الطلب</text><rect x="240" y="236" width="860" height="62" rx="10" fill="#ffffff" stroke="#2f5d9a" stroke-width="1.4"/><text x="256" y="272" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">lib/api/pledges.ts → apiFetch → POST /pledges  { campaignId, amount, method }  Authorization: Bearer</text><path d="M135,298 L135,314" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="314" width="190" height="62" rx="10" fill="#9b3a31"/><text x="135" y="340" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Guard</text><text x="135" y="361" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">الحارس</text><rect x="240" y="314" width="860" height="62" rx="10" fill="#ffffff" stroke="#9b3a31" stroke-width="1.4"/><text x="256" y="350" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">JwtAuthGuard → JwtStrategy.validate() reloads id / role / isActive from the database</text><path d="M135,376 L135,392" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="392" width="190" height="62" rx="10" fill="#8a5d0c"/><text x="135" y="418" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">DTO</text><text x="135" y="439" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">التحقق</text><rect x="240" y="392" width="860" height="62" rx="10" fill="#ffffff" stroke="#8a5d0c" stroke-width="1.4"/><text x="256" y="428" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">CreatePledgeDto + ValidationPipe (whitelist, forbidNonWhitelisted, transform)</text><path d="M135,454 L135,470" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="470" width="190" height="62" rx="10" fill="#1f6b48"/><text x="135" y="496" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Controller</text><text x="135" y="517" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">المتحكم</text><rect x="240" y="470" width="860" height="62" rx="10" fill="#ffffff" stroke="#1f6b48" stroke-width="1.4"/><text x="256" y="506" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">PledgesController.create(@CurrentUser() user, @Body() dto)</text><path d="M135,532 L135,548" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="548" width="190" height="62" rx="10" fill="#1f6b48"/><text x="135" y="574" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Service</text><text x="135" y="595" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">الخدمة</text><rect x="240" y="548" width="860" height="62" rx="10" fill="#ffffff" stroke="#1f6b48" stroke-width="1.4"/><text x="256" y="584" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">PledgesService.create: requireRole([DONOR]) · campaign accepts pledges · referenceNo · receiving accounts</text><path d="M135,610 L135,626" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="626" width="190" height="62" rx="10" fill="#0f3d2a"/><text x="135" y="652" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Persistence</text><text x="135" y="673" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">التخزين</text><rect x="240" y="626" width="860" height="62" rx="10" fill="#ffffff" stroke="#0f3d2a" stroke-width="1.4"/><text x="256" y="662" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">prisma.$transaction → Pledge (PLEDGED) · Notification · OutboundMessage · AuditLog</text><path d="M135,688 L135,704" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="704" width="190" height="62" rx="10" fill="#c27c0e"/><text x="135" y="730" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Response</text><text x="135" y="751" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">الاستجابة</text><rect x="240" y="704" width="860" height="62" rx="10" fill="#ffffff" stroke="#c27c0e" stroke-width="1.4"/><text x="256" y="740" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, 'Segoe UI', monospace">{ pledge, instructions } → the page shows the reference and the (fake) receiving account</text><rect x="1140" y="80" width="390" height="686" rx="10" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="1335" y="108" font-size="15" font-weight="700" fill="#1b2a22" text-anchor="middle" direction="ltr">The rest of the journey · بقية الرحلة</text><rect x="1160" y="130" width="350" height="86" rx="8" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1176" y="156" font-size="12.5" font-weight="700" fill="#1f6b48" text-anchor="start" direction="ltr" font-family="Consolas, monospace">POST /pledges/:id/receipts</text><text x="1176" y="180" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">receipt → Verification PENDING</text><text x="1494" y="204" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">رفع الإيصال</text><path d="M1335,216 L1335,234" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1160" y="234" width="350" height="86" rx="8" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1176" y="260" font-size="12.5" font-weight="700" fill="#1f6b48" text-anchor="start" direction="ltr" font-family="Consolas, monospace">GET /verifications</text><text x="1176" y="284" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">finance queue</text><text x="1494" y="308" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">قائمة التحقق</text><path d="M1335,320 L1335,338" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1160" y="338" width="350" height="86" rx="8" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1176" y="364" font-size="12.5" font-weight="700" fill="#1f6b48" text-anchor="start" direction="ltr" font-family="Consolas, monospace">POST /verifications/:id/approve</text><text x="1176" y="388" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">VERIFIED · R-YYYY-NNNNNN · verifiedAmount</text><text x="1494" y="412" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">اعتماد وإيصال رسمي</text><path d="M1335,424 L1335,442" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1160" y="442" width="350" height="86" rx="8" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1176" y="468" font-size="12.5" font-weight="700" fill="#1f6b48" text-anchor="start" direction="ltr" font-family="Consolas, monospace">GET /official-receipts/:no</text><text x="1176" y="492" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">receipt + QR (SVG)</text><text x="1494" y="516" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">الإيصال مع QR</text><path d="M1335,528 L1335,546" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1160" y="546" width="350" height="86" rx="8" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1176" y="572" font-size="12.5" font-weight="700" fill="#1f6b48" text-anchor="start" direction="ltr" font-family="Consolas, monospace">GET /stats/transparency</text><text x="1176" y="596" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">totals collected / spent / remaining</text><text x="1494" y="620" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">لوحة الشفافية</text><path d="M1335,632 L1335,650" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1160" y="650" width="350" height="86" rx="8" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1176" y="676" font-size="12.5" font-weight="700" fill="#1f6b48" text-anchor="start" direction="ltr" font-family="Consolas, monospace">POST /expenditures</text><text x="1176" y="700" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">spending with public-safe proof</text><text x="1494" y="724" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">الصرف مع إثبات</text><rect x="40" y="800" width="1490" height="170" rx="10" fill="#e7f2eb" stroke="#1f6b48" stroke-width="1.4"/><text x="60" y="830" font-size="15" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr">Where the rules live · أين تعيش القواعد</text><text x="60" y="860" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr">The backend decides: the page only collects input; the service checks the role, the campaign state and the amount.</text><text x="60" y="886" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr">Money is counted once: only a finance approval (by someone else than the entry owner) adds to verifiedAmount; Demo money is kept apart.</text><text x="60" y="912" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="ltr">Every write is audited (AuditLog) and every donation path sends an instant in-app notification + a WhatsApp outbox message.</text><text x="1510" y="938" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="start" direction="rtl">الواجهة تجمع المدخلات فقط؛ الخدمة تقرر. الاعتماد المالي وحده يزيد الرصيد المحقق. كل تعديل مسجل، وكل تبرع يصله إشعار فوري.</text>
</svg>
