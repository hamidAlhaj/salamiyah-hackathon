nt-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">الحماية وتحديد المعدل</text><path d="M1080,283 L1080,295" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><rect x="905" y="365" width="350" height="58" rx="10" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1080" y="389.9375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">Services + RoleAccessService.requireRole</text><text x="1080" y="406.8125" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">قواعد العمل والأدوار</text><path d="M1080,353 L1080,365" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><rect x="905" y="435" width="350" height="58" rx="10" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1080" y="459.9375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">PrismaService ($transaction)</text><text x="1080" y="476.8125" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">الوصول للبيانات</text><path d="M1080,423 L1080,435" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><rect x="905" y="515" width="170" height="62" rx="10" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="990" y="542.1" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">AuditService</text><text x="990" y="558.3000000000001" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">سجل التدقيق</text><rect x="1085" y="515" width="170" height="62" rx="10" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1170" y="542.1" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">StorageService</text><text x="1170" y="558.3000000000001" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">فحص وتخزين الملفات</text><rect x="905" y="587" width="170" height="62" rx="10" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="990" y="614.1" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">Notifications</text><text x="990" y="630.3000000000001" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">الإشعارات</text><rect x="1085" y="587" width="170" height="62" rx="10" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1170" y="614.1" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">WhatsApp outbox</text><text x="1170" y="630.3000000000001" font-size="12" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">صندوق رسائل واتساب</text><rect x="905" y="659" width="350" height="50" rx="10" fill="#ffffff" stroke="#b7c6bd" stroke-width="1.4"/><text x="1080" y="680.1" font-size="12" font-weight="600" fill="#1f6b48" text-anchor="middle" direction="ltr">Swagger UI: /api/docs</text><text x="1080" y="696.3000000000001" font-size="12" font-weight="600" fill="#1f6b48" text-anchor="middle" direction="rtl">توثيق الواجهة البرمجية</text><rect x="1360" y="120" width="250" height="120" rx="10" fill="#fcf1dc" stroke="#8a5d0c" stroke-width="1.4"/><text x="1485" y="167" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">PostgreSQL 18 (local)</text><text x="1485" y="184.55" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">قاعدة البيانات</text><text x="1485" y="202.1" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">21 tables · Prisma 5.22 migrations</text><rect x="1360" y="290" width="250" height="130" rx="10" fill="#fcf1dc" stroke="#8a5d0c" stroke-width="1.4"/><text x="1485" y="333.225" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">File storage (uploads/)</text><text x="1485" y="350.77500000000003" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">تخزين الملفات</text><text x="1485" y="368.32500000000005" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">receipts · proofs · case documents</text><text x="1485" y="385.875" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">magic bytes · EXIF stripped · sha256</text><rect x="1360" y="470" width="250" height="140" rx="10" fill="#ffffff" stroke="#6b756f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1485" y="518.2249999999999" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">WhatsApp (council phone)</text><text x="1485" y="535.7749999999999" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">واتساب من هاتف المجلس</text><text x="1485" y="553.3249999999999" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">staff taps a wa.me link</text><text x="1485" y="570.8749999999999" font-size="11.5" font-weight="600" fill="#9b3a31" text-anchor="middle" direction="ltr">no WhatsApp API · لا API</text><rect x="1360" y="650" width="250" height="90" rx="10" fill="#ffffff" stroke="#6b756f" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1485" y="682" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">Google OAuth (optional)</text><text x="1485" y="699.55" font-size="13" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">تسجيل Google اختياري</text><text x="1485" y="717.1" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">off unless GOOGLE_* set</text><path d="M335,205 L465,205" fill="none" stroke="#2f5d9a" stroke-width="1.6" marker-end="url(#arrowBlue)"/><rect x="361.65999999999997" y="169.35" width="76.68" height="33.3" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="400" y="182.85000000000002" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">HTTPS pages</text><text x="400" y="196.50000000000003" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">صفحات</text><path d="M335,360 L400,360 L400,260 L465,260" fill="none" stroke="#2f5d9a" stroke-width="1.6" marker-end="url(#arrowBlue)"/><path d="M775,406 L905,185" fill="none" stroke="#2f5d9a" stroke-width="1.6" marker-end="url(#arrowBlue)"/><rect x="798.72" y="306.525" width="82.56" height="46.95" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="840" y="320.02500000000003" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">REST + JSON</text><text x="840" y="333.675" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">Bearer JWT</text><text x="840" y="347.32500000000005" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">server → API</text><path d="M335,525 L840,525 L840,200 L905,200" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><rect x="426.41999999999996" y="508.35" width="347.16" height="33.3" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="600" y="521.8499999999999" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">REST + JSON · Authorization: Bearer (EXPO_PUBLIC_API_URL)</text><text x="600" y="535.4999999999999" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">التطبيق يتصل بالـAPI مباشرة</text><path d="M1255,464 L1310,464 L1310,180 L1360,180" fill="none" stroke="#8a5d0c" stroke-width="1.6" marker-end="url(#arrowAmber)"/><rect x="1286.36" y="290.175" width="47.28" height="19.65" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1310" y="303.675" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">Prisma</text><path d="M1255,546 L1330,546 L1330,355 L1360,355" fill="none" stroke="#8a5d0c" stroke-width="1.6" marker-end="url(#arrowAmber)"/><path d="M1255,618 L1300,618 L1300,540 L1360,540" fill="none" stroke="#6b756f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="1264.6" y="568.35" width="70.80000000000001" height="33.3" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1300" y="581.8499999999999" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">wa.me link</text><text x="1300" y="595.4999999999999" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">رابط</text><path d="M1255,690 L1360,690" fill="none" stroke="#6b756f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="1262.84" y="698.175" width="94.32000000000001" height="19.65" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1310" y="711.675" font-size="10.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">optional OAuth</text><rect x="30" y="760" width="1580" height="110" rx="10" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="50" y="790" font-size="14" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr">Notes · ملاحظات</text><text x="50" y="815" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Browsers never hold the JWT or call the API: the Next.js server does (HttpOnly cookie). The Expo app keeps its token in SecureStore and calls the API directly.</text><text x="1590" y="838" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="rtl">المتصفح لا يحمل التوكن ولا يتصل بالـAPI؛ خادم Next.js يفعل ذلك. تطبيق Expo يحفظ التوكن في SecureStore ويتصل بالـAPI مباشرة.</text><text x="50" y="860" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">All receiving accounts, phone numbers and seed data are fictional for the hackathon. Simulated e-payments carry a «Demo» badge and never count as verified money.</text>
</svg>
