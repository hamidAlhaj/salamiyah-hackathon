<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1296" viewBox="0 0 1640 1296" font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif">
<title>Donation sequence</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55655c"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6b48"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9a"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5d0c"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b3a31"/></marker></defs>
<rect width="1640" height="1296" fill="#ffffff"/>
<text x="820" y="40" font-size="22" font-weight="700" fill="#0f3d2a" text-anchor="middle" direction="ltr">Donation sequence: transfer → verification → official receipt + QR</text><text x="820" y="68" font-size="18" font-weight="600" fill="#0f3d2a" text-anchor="middle" direction="rtl">تسلسل التبرع: حوالة ← تحقق مالي ← إيصال رسمي مع QR</text><path d="M110,128 L110,1256" fill="none" stroke="#b7c6bd" stroke-width="1.6" stroke-dasharray="4 5"/><rect x="10" y="86" width="200" height="46" rx="10" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="110" y="104.9375" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Donor</text><text x="110" y="121.8125" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">المتبرع</text><path d="M342,128 L342,1256" fill="none" stroke="#b7c6bd" stroke-width="1.6" stroke-dasharray="4 5"/><rect x="242" y="86" width="200" height="46" rx="10" fill="#ffffff" stroke="#2f5d9a" stroke-width="1.8"/><text x="342" y="104.9375" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Web (Next.js) / Expo app</text><text x="342" y="121.8125" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">الويب / التطبيق</text><path d="M574,128 L574,1256" fill="none" stroke="#b7c6bd" stroke-width="1.6" stroke-dasharray="4 5"/><rect x="474" y="86" width="200" height="46" rx="10" fill="#ffffff" stroke="#1f6b48" stroke-width="1.8"/><text x="574" y="104.9375" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">NestJS API</text><text x="574" y="121.8125" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">الـAPI</text><path d="M806,128 L806,1256" fill="none" stroke="#b7c6bd" stroke-width="1.6" stroke-dasharray="4 5"/><rect x="706" y="86" width="200" height="46" rx="10" fill="#ffffff" stroke="#8a5d0c" stroke-width="1.8"/><text x="806" y="104.9375" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">File storage</text><text x="806" y="121.8125" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">تخزين الملفات</text><path d="M1038,128 L1038,1256" fill="none" stroke="#b7c6bd" stroke-width="1.6" stroke-dasharray="4 5"/><rect x="938" y="86" width="200" height="46" rx="10" fill="#ffffff" stroke="#8a5d0c" stroke-width="1.8"/><text x="1038" y="104.9375" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">PostgreSQL</text><text x="1038" y="121.8125" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">قاعدة البيانات</text><path d="M1270,128 L1270,1256" fill="none" stroke="#b7c6bd" stroke-width="1.6" stroke-dasharray="4 5"/><rect x="1170" y="86" width="200" height="46" rx="10" fill="#ffffff" stroke="#6b756f" stroke-width="1.8"/><text x="1270" y="104.9375" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Notifications + outbox</text><text x="1270" y="121.8125" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">الإشعارات وواتساب</text><path d="M1502,128 L1502,1256" fill="none" stroke="#b7c6bd" stroke-width="1.6" stroke-dasharray="4 5"/><rect x="1402" y="86" width="200" height="46" rx="10" fill="#ffffff" stroke="#1f6b48" stroke-width="1.8"/><text x="1502" y="104.9375" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Finance verifier</text><text x="1502" y="121.8125" font-size="12.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">المدقق المالي</text><path d="M110,170 L338,170" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226" y="150" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Choose campaign, amount, transfer method</text><text x="226" y="165" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">اختيار الحملة والمبلغ وطريقة التحويل</text><circle cx="124" cy="137" r="0"/><text x="88" y="174" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">1</text><path d="M342,224 L570,224" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="458" y="204" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">POST /pledges  (Bearer JWT, CreatePledgeDto)</text><text x="458" y="219" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إنشاء تعهد</text><circle cx="356" cy="191" r="0"/><text x="320" y="228" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">2</text><path d="M574,278 L1034,278" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="806" y="258" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Pledge PLEDGED + referenceNo P-XXXXXX</text><text x="806" y="273" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">حفظ التعهد</text><circle cx="588" cy="245" r="0"/><text x="552" y="282" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">3</text><path d="M574,332 L1266,332" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="922" y="312" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">In-app notification + WhatsApp outbox message</text><text x="922" y="327" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إشعار فوري بالاستلام</text><circle cx="588" cy="299" r="0"/><text x="552" y="336" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">4</text><path d="M574,386 L346,386" fill="none" stroke="#55655c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="458" y="366" font-size="12" font-weight="600" fill="#55655c" text-anchor="middle" direction="ltr">{ pledge, instructions }: fake receiving account + reference</text><text x="458" y="381" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">رقم المرجع وحساب الاستلام (تجريبي)</text><circle cx="356" cy="353" r="0"/><text x="320" y="390" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">5</text><rect x="15" y="418" width="300" height="44" rx="6" fill="#fcf1dc" stroke="#8a5d0c" stroke-width="1.4"/><text x="165" y="436.2625" font-size="11.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">Donor transfers outside the platform (bank / e-wallet)</text><text x="165" y="451.78749999999997" font-size="11.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">التحويل يتم خارج المنصة</text><path d="M110,494 L338,494" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226" y="474" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Upload the transfer receipt photo</text><text x="226" y="489" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">رفع صورة الإيصال</text><circle cx="124" cy="461" r="0"/><text x="88" y="498" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">6</text><path d="M342,548 L570,548" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="458" y="528" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">POST /pledges/:id/receipts  (multipart)</text><text x="458" y="543" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">رفع الإيصال</text><circle cx="356" cy="515" r="0"/><text x="320" y="552" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">7</text><path d="M574,602 L802,602" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="690" y="582" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Check magic bytes · strip EXIF · sha256 · store</text><text x="690" y="597" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">فحص الملف وحذف بيانات الموقع</text><circle cx="588" cy="569" r="0"/><text x="552" y="606" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">8</text><path d="M574,656 L1034,656" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="806" y="636" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Receipt + Verification PENDING · Pledge RECEIPT_UPLOADED</text><text x="806" y="651" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">قيد التحقق</text><circle cx="588" cy="623" r="0"/><text x="552" y="660" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">9</text><path d="M574,710 L1266,710" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="922" y="690" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">«Received, pending verification»</text><text x="922" y="705" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">استلمنا إيصالك وهو قيد التحقق</text><circle cx="588" cy="677" r="0"/><text x="552" y="714" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">10</text><path d="M1502,764 L578,764" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1038" y="744" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">GET /verifications  (queue, oldest first)</text><text x="1038" y="759" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">قائمة التحقق</text><circle cx="588" cy="731" r="0"/><text x="552" y="768" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">11</text><path d="M1502,818 L578,818" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1038" y="798" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">POST /verifications/:id/approve  (not their own entry)</text><text x="1038" y="813" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">اعتماد التبرع</text><circle cx="588" cy="785" r="0"/><text x="552" y="822" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">12</text><path d="M574,872 L1034,872" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="806" y="852" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">$transaction: APPROVED · Pledge VERIFIED + R-YYYY-NNNNNN · verifiedAmount += amount · AuditLog</text><text x="806" y="867" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">معاملة واحدة: اعتماد ورقم إيصال رسمي وزيادة الرصيد المحقق</text><circle cx="588" cy="839" r="0"/><text x="552" y="876" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">13</text><path d="M574,926 L1266,926" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="922" y="906" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Official receipt notification + wa.me link</text><text x="922" y="921" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إشعار الإيصال الرسمي</text><circle cx="588" cy="893" r="0"/><text x="552" y="930" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">14</text><path d="M110,980 L338,980" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="226" y="960" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">Open the official receipt</text><text x="226" y="975" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">فتح الإيصال الرسمي</text><circle cx="124" cy="947" r="0"/><text x="88" y="984" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">15</text><path d="M342,1034 L570,1034" fill="none" stroke="#1b2a22" stroke-width="1.6" marker-end="url(#arrow)"/><text x="458" y="1014" font-size="12" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">GET /official-receipts/:no  (public)</text><text x="458" y="1029" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">جلب الإيصال برقمه</text><circle cx="356" cy="1001" r="0"/><text x="320" y="1038" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">16</text><path d="M574,1088 L346,1088" fill="none" stroke="#55655c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="458" y="1068" font-size="12" font-weight="600" fill="#55655c" text-anchor="middle" direction="ltr">Receipt data + QR (SVG) → public /receipts/:no</text><text x="458" y="1083" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إيصال مع رمز QR للتحقق</text><circle cx="356" cy="1055" r="0"/><text x="320" y="1092" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">17</text><path d="M342,1142 L114,1142" fill="none" stroke="#55655c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="226" y="1122" font-size="12" font-weight="600" fill="#55655c" text-anchor="middle" direction="ltr">Printable receipt; anyone can verify it by QR</text><text x="226" y="1137" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إيصال قابل للطباعة والتحقق</text><circle cx="124" cy="1109" r="0"/><text x="88" y="1146" font-size="11" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">18</text><rect x="40" y="1226" width="1560" height="48" rx="10" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="60" y="1246" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Rules: a verifier never verifies their own entry · simulated (Demo) payments never reach verifiedAmount · collectors confirm cash but never verify.</text><text x="1580" y="1265" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="rtl">القواعد: لا يعتمد المدقق إدخاله · المدفوعات التجريبية لا تدخل الرصيد المحقق · المكي يؤكد الاستلام ولا يعتمد.</text>
</svg>
