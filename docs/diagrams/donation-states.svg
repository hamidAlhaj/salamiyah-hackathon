<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="820" viewBox="0 0 1460 820" font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif">
<title>Donation states</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55655c"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6b48"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9a"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5d0c"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b3a31"/></marker></defs>
<rect width="1460" height="820" fill="#ffffff"/>
<text x="730" y="40" font-size="24" font-weight="700" fill="#0f3d2a" text-anchor="middle" direction="ltr">Donation (Pledge) state machine · حالات التبرع</text><text x="730" y="64" font-size="13" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">PledgeStatus in schema.prisma; transitions from pledges.service.ts, collector.service.ts, verifications.service.ts</text><circle cx="70" cy="330" r="12" fill="#1b2a22"/><path d="M82,330 L180,330" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="34.67999999999999" y="282.7" width="190.64000000000001" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="130" y="296.70000000000005" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">POST /pledges · /pledges/cash</text><text x="130" y="311.00000000000006" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">تعهد حوالة أو نقد</text><path d="M78,320 L150,140 L180,140" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20.83999999999999" y="182.7" width="178.32000000000002" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="110" y="196.7" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">POST /pledges/demo (isDemo)</text><text x="110" y="211" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">دفع تجريبي «Demo»</text><path d="M70,342 L70,492 L640,492" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="334.64" y="494.7" width="270.72" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="470" y="508.70000000000005" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">POST /pledges/council · /pledges/collector</text><text x="470" y="523" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إدخال في المجلس أو من المكي</text><path d="M420,330 L560,330 L560,230 L640,220" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="440.03999999999996" y="262.7" width="239.92000000000002" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="560" y="276.70000000000005" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">receipt upload → Verification PENDING</text><text x="560" y="291.00000000000006" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">رفع الإيصال</text><path d="M360,362 L360,440 L640,470" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="368.52" y="402.7" width="202.96" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="470" y="416.70000000000005" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">Mukhi confirms cash (cash only)</text><text x="470" y="431.00000000000006" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">المكي يؤكد الاستلام</text><path d="M300,362 L300,568" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="244.72" y="537.7" width="110.56" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="300" y="551.7" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">donor cancels</text><text x="300" y="566" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إلغاء من المتبرع</text><path d="M880,220 L1100,220" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><rect x="870.04" y="172.7" width="239.92000000000002" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="990" y="186.7" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">finance approves → R-YYYY-NNNNNN + QR</text><text x="990" y="201" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">اعتماد: إيصال رسمي ورصيد محقق</text><path d="M880,470 L1100,400 L1160,252" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><rect x="1024.72" y="342.7" width="110.56" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1080" y="356.70000000000005" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">finance approves</text><text x="1080" y="371.00000000000006" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">اعتماد مالي</text><path d="M840,252 L1120,528" fill="none" stroke="#9b3a31" stroke-width="1.6" marker-end="url(#arrowRed)"/><rect x="920.08" y="312.7" width="159.84" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1000" y="326.70000000000005" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">finance rejects (reason)</text><text x="1000" y="341.00000000000006" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">رفض مع السبب</text><path d="M880,470 L1100,470 L1100,545 L1100,545" fill="none" stroke="#9b3a31" stroke-width="1.6" marker-end="url(#arrowRed)"/><rect x="957.8" y="502.7" width="104.4" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1010" y="516.7" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">finance rejects</text><text x="1010" y="531" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">رفض</text><path d="M1300,528 L1300,340 L1300,320 L870,320 L870,252" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1240.84" y="402.7" width="178.32000000000002" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1330" y="416.70000000000005" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">donor uploads a new receipt</text><text x="1330" y="431.00000000000006" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إيصال جديد</text><path d="M1220,592 L1220,720 L300,720 L300,632" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="713.96" y="702.7" width="92.08000000000001" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="760" y="716.7" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">donor cancels</text><text x="760" y="731" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">إلغاء</text><rect x="180" y="298" width="240" height="64" rx="30" fill="#ffffff" stroke="#2f5d9a" stroke-width="2"/><text x="300" y="325.77500000000003" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">PLEDGED</text><text x="300" y="343.32500000000005" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">تعهد مسجل</text><rect x="180" y="108" width="240" height="64" rx="30" fill="#ffffff" stroke="#6b756f" stroke-width="2"/><text x="300" y="135.775" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">DEMO_CONFIRMED</text><text x="300" y="153.32500000000002" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">دفع تجريبي مؤكد</text><rect x="180" y="568" width="240" height="64" rx="30" fill="#ffffff" stroke="#6b756f" stroke-width="2"/><text x="300" y="595.775" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">CANCELLED</text><text x="300" y="613.3249999999999" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">ملغى</text><rect x="640" y="188" width="240" height="64" rx="30" fill="#ffffff" stroke="#8a5d0c" stroke-width="2"/><text x="760" y="215.775" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">RECEIPT_UPLOADED</text><text x="760" y="233.32500000000002" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">إيصال مرفوع — قيد التحقق</text><rect x="640" y="438" width="240" height="64" rx="30" fill="#ffffff" stroke="#8a5d0c" stroke-width="2"/><text x="760" y="465.77500000000003" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">COLLECTED</text><text x="760" y="483.32500000000005" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">استلمه المكي — قيد التحقق</text><rect x="1100" y="188" width="240" height="64" rx="30" fill="#ffffff" stroke="#1f6b48" stroke-width="2"/><text x="1220" y="215.775" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">VERIFIED</text><text x="1220" y="233.32500000000002" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">معتمد + إيصال رسمي</text><rect x="1100" y="528" width="240" height="64" rx="30" fill="#ffffff" stroke="#9b3a31" stroke-width="2"/><text x="1220" y="555.775" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">REJECTED</text><text x="1220" y="573.3249999999999" font-size="13" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">مرفوض (مع السبب)</text><path d="M1340,220 L1395,220" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="1410" cy="220" r="13" fill="none" stroke="#1b2a22" stroke-width="2"/><circle cx="1410" cy="220" r="7" fill="#1b2a22"/><path d="M420,140 L455,140" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="470" cy="140" r="13" fill="none" stroke="#1b2a22" stroke-width="2"/><circle cx="470" cy="140" r="7" fill="#1b2a22"/><path d="M180,600 L145,600" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="130" cy="600" r="13" fill="none" stroke="#1b2a22" stroke-width="2"/><circle cx="130" cy="600" r="7" fill="#1b2a22"/><rect x="40" y="760" width="1380" height="44" rx="10" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="60" y="778" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Only VERIFIED adds to Campaign.verifiedAmount (and may set the campaign FUNDED). DEMO_CONFIRMED is shown separately. COLLECTED = «received, pending verification».</text><text x="1400" y="796" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="rtl">فقط VERIFIED يزيد الرصيد المحقق؛ التجريبي يظهر منفصلاً؛ COLLECTED = «استُلم، بانتظار التحقق».</text>
