<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif">
<title>Backend map</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55655c"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6b48"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9a"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5d0c"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b3a31"/></marker></defs>
<rect width="1600" height="960" fill="#ffffff"/>
<text x="800" y="40" font-size="23" font-weight="700" fill="#0f3d2a" text-anchor="middle" direction="ltr">Backend map — every module is built the same way · خريطة الخلفية</text><rect x="30" y="80" width="280" height="250" rx="10" fill="#ffffff" stroke="#2f5d9a" stroke-width="2"/><rect x="30" y="80" width="280" height="54" rx="10" fill="#2f5d9a"/><text x="170" y="104" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Controller</text><text x="170" y="125" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">المتحكم</text><text x="170" y="165" font-size="13.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">where HTTP enters the feature</text><text x="170" y="186" font-size="13" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">هنا يدخل طلب HTTP</text><line x1="50" y1="205" x2="290" y2="205" stroke="#b7c6bd"/><text x="170" y="232" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">in Madad:</text><text x="170" y="256" font-size="12" font-weight="600" fill="#2f5d9a" text-anchor="middle" direction="ltr">PledgesController @Post('pledges')</text><text x="170" y="280" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">ParseUUIDPipe · @ApiTags · @CurrentUser()</text><path d="M312,205 L340,205" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="342" y="80" width="280" height="250" rx="10" fill="#ffffff" stroke="#8a5d0c" stroke-width="2"/><rect x="342" y="80" width="280" height="54" rx="10" fill="#8a5d0c"/><text x="482" y="104" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">DTO</text><text x="482" y="125" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">كائن نقل البيانات</text><text x="482" y="165" font-size="13.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">checks what came in</text><text x="482" y="186" font-size="13" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">يفحص ما وصل</text><line x1="362" y1="205" x2="602" y2="205" stroke="#b7c6bd"/><text x="482" y="232" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">in Madad:</text><text x="482" y="256" font-size="12" font-weight="600" fill="#8a5d0c" text-anchor="middle" direction="ltr">CreatePledgeDto (class-validator)</text><text x="482" y="280" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">ValidationPipe whitelist + forbidNonWhitelisted</text><path d="M624,205 L652,205" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="654" y="80" width="280" height="250" rx="10" fill="#ffffff" stroke="#1f6b48" stroke-width="2"/><rect x="654" y="80" width="280" height="54" rx="10" fill="#1f6b48"/><text x="794" y="104" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Service</text><text x="794" y="125" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">الخدمة</text><text x="794" y="165" font-size="13.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">decides what should happen</text><text x="794" y="186" font-size="13" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">يقرر ماذا يحدث</text><line x1="674" y1="205" x2="914" y2="205" stroke="#b7c6bd"/><text x="794" y="232" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">in Madad:</text><text x="794" y="256" font-size="12" font-weight="600" fill="#1f6b48" text-anchor="middle" direction="ltr">PledgesService.create()</text><text x="794" y="280" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">rules · $transaction · AuditService.log</text><path d="M936,205 L964,205" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="966" y="80" width="280" height="250" rx="10" fill="#ffffff" stroke="#9b3a31" stroke-width="2"/><rect x="966" y="80" width="280" height="54" rx="10" fill="#9b3a31"/><text x="1106" y="104" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Guard</text><text x="1106" y="125" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">الحارس</text><text x="1106" y="165" font-size="13.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">may the user continue?</text><text x="1106" y="186" font-size="13" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">هل يُسمح بالمتابعة؟</text><line x1="986" y1="205" x2="1226" y2="205" stroke="#b7c6bd"/><text x="1106" y="232" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">in Madad:</text><text x="1106" y="256" font-size="12" font-weight="600" fill="#9b3a31" text-anchor="middle" direction="ltr">JwtAuthGuard (passport-jwt)</text><text x="1106" y="280" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">roles: RoleAccessService.requireRole → 403</text><path d="M1248,205 L1276,205" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1278" y="80" width="280" height="250" rx="10" fill="#ffffff" stroke="#0f3d2a" stroke-width="2"/><rect x="1278" y="80" width="280" height="54" rx="10" fill="#0f3d2a"/><text x="1418" y="104" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" direction="ltr">Persistence</text><text x="1418" y="125" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" direction="rtl">التخزين</text><text x="1418" y="165" font-size="13.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">stores / retrieves the data</text><text x="1418" y="186" font-size="13" font-weight="400" fill="#55655c" text-anchor="middle" direction="rtl">يحفظ ويسترجع</text><line x1="1298" y1="205" x2="1538" y2="205" stroke="#b7c6bd"/><text x="1418" y="232" font-size="11.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">in Madad:</text><text x="1418" y="256" font-size="12" font-weight="600" fill="#0f3d2a" text-anchor="middle" direction="ltr">PrismaService → PostgreSQL</text><text x="1418" y="280" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">21 models · uuid · Decimal(14,2)</text><text x="30" y="380" font-size="15" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr">Runtime order of one request (NestJS lifecycle) · ترتيب التنفيذ الفعلي لطلب واحد</text><rect x="30" y="400" width="200" height="58" rx="10" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="130" y="424.9375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">ThrottlerGuard</text><text x="130" y="441.8125" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">تحديد المعدل</text><path d="M230,429 L252,429" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="252" y="400" width="200" height="58" rx="10" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="352" y="424.9375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">JwtAuthGuard</text><text x="352" y="441.8125" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">التحقق من التوكن</text><path d="M452,429 L474,429" fill="none" stroke="#55655c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="474" y="400" width="200" height="58" rx="10" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="574" y="424.9375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">ValidationPipe (DTO)</text><text x="574" y="441.8125" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="rtl">فحص المدخلات</text><path d="M674,429 L696,429" fill=