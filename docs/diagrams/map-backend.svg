ion="ltr">The guard runs before the DTO pipe at run time; the five pieces above are the roles, not the call order. Errors: { statusCode, message, error, path, timestamp }.</text><text x="30" y="540" font-size="15" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr">The 20 modules in api/src, by domain · الوحدات حسب المجال</text><rect x="30" y="560" width="290" height="370" rx="10" fill="#ffffff" stroke="#2f5d9a" stroke-width="1.8"/><text x="175" y="588" font-size="14" font-weight="700" fill="#2f5d9a" text-anchor="middle" direction="ltr">Identity · الهوية</text><rect x="50" y="606" width="250" height="36" rx="6" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="175" y="628.375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">auth</text><rect x="50" y="650" width="250" height="36" rx="6" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="175" y="672.375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">users</text><rect x="342" y="560" width="290" height="370" rx="10" fill="#ffffff" stroke="#1f6b48" stroke-width="1.8"/><text x="487" y="588" font-size="14" font-weight="700" fill="#1f6b48" text-anchor="middle" direction="ltr">Campaigns · الحملات</text><rect x="362" y="606" width="250" height="36" rx="6" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="487" y="628.375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">categories</text><rect x="362" y="650" width="250" height="36" rx="6" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="487" y="672.375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">campaigns</text><rect x="362" y="694" width="250" height="36" rx="6" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="487" y="716.375" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="middle" direction="ltr">payment-methods</text><rect x="3