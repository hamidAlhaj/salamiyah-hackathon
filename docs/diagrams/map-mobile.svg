<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif">
<title>Mobile map</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55655c"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6b48"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d9a"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5d0c"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b3a31"/></marker></defs>
<rect width="1500" height="820" fill="#ffffff"/>
<text x="750" y="40" font-size="23" font-weight="700" fill="#0f3d2a" text-anchor="middle" direction="ltr">Mobile map — Expo SDK 58 donor app (mobile/src) · خريطة تطبيق الموبايل</text><rect x="30" y="80" width="640" height="666" rx="10" fill="#ffffff" stroke="#c27c0e" stroke-width="1.8"/><text x="350" y="110" font-size="15" font-weight="700" fill="#c27c0e" text-anchor="middle" direction="ltr">src/app — expo-router screens (_layout.tsx: fonts, RTL, auth)</text><rect x="50" y="130" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="154" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">index.tsx</text><text x="66" y="176" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Campaigns of every category</text><text x="634" y="164" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">كل الحملات حسب الفئة</text><rect x="50" y="202" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="226" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">campaign/[slug].tsx</text><text x="66" y="248" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Campaign, ledger, receiving accounts</text><text x="634" y="236" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">الحملة والحساب</text><rect x="50" y="274" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="298" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">pledge/[campaignId].tsx</text><text x="66" y="320" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Donate: e-wallet (Demo) · transfer + receipt · cash point</text><text x="634" y="308" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">التبرع بكل الطرق</text><rect x="50" y="346" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="370" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">receipt/[pledgeId].tsx</text><text x="66" y="392" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Acknowledgement / official receipt</text><text x="634" y="380" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">الإيصال</text><rect x="50" y="418" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="442" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">donations.tsx</text><text x="66" y="464" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">My donations</text><text x="634" y="452" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">تبرعاتي</text><rect x="50" y="490" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="514" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">notifications.tsx</text><text x="66" y="536" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Notifications</text><text x="634" y="524" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">الإشعارات</text><rect x="50" y="562" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="586" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">transparency.tsx</text><text x="66" y="608" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Transparency dashboard</text><text x="634" y="596" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">لوحة الشفافية</text><rect x="50" y="634" width="600" height="60" rx="8" fill="#f2f4f3" stroke="#b7c6bd" stroke-width="1.4"/><text x="66" y="658" font-size="13" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">login.tsx</text><text x="66" y="680" font-size="12" font-weight="400" fill="#55655c" text-anchor="start" direction="ltr">Phone + password login</text><text x="634" y="668" font-size="12.5" font-weight="400" fill="#1b2a22" text-anchor="end" direction="ltr">تسجيل الدخول</text><rect x="720" y="80" width="750" height="506" rx="10" fill="#ffffff" stroke="#2f5d9a" stroke-width="1.8"/><text x="1095" y="110" font-size="15" font-weight="700" fill="#2f5d9a" text-anchor="middle" direction="ltr">Building blocks · مكونات البناء</text><text x="740" y="152" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">lib/api.ts</text><text x="1450" y="152" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">fetch + Authorization: Bearer; 401 → clear token → login</text><line x1="740" y1="166" x2="1450" y2="166" stroke="#b7c6bd"/><text x="740" y="204" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">lib/storage.ts</text><text x="1450" y="204" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">token in expo-secure-store</text><line x1="740" y1="218" x2="1450" y2="218" stroke="#b7c6bd"/><text x="740" y="256" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">lib/auth.tsx</text><text x="1450" y="256" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">session context</text><line x1="740" y1="270" x2="1450" y2="270" stroke="#b7c6bd"/><text x="740" y="308" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">lib/config.ts</text><text x="1450" y="308" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">EXPO_PUBLIC_API_URL · EXPO_PUBLIC_SITE_URL</text><line x1="740" y1="322" x2="1450" y2="322" stroke="#b7c6bd"/><text x="740" y="360" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">lib/funding.ts · receipt.ts · links.ts</text><text x="1450" y="360" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">progress, receipt links, share</text><line x1="740" y1="374" x2="1450" y2="374" stroke="#b7c6bd"/><text x="740" y="412" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">ui/ (theme, CampaignCover, CategoryIcon)</text><text x="1450" y="412" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">react-native-svg illustrations</text><line x1="740" y1="426" x2="1450" y2="426" stroke="#b7c6bd"/><text x="740" y="464" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">i18n/ (i18next)</text><text x="1450" y="464" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">Arabic RTL first, English</text><line x1="740" y1="478" x2="1450" y2="478" stroke="#b7c6bd"/><text x="740" y="516" font-size="12.5" font-weight="700" fill="#1b2a22" text-anchor="start" direction="ltr" font-family="Consolas, monospace">shared/</text><text x="1450" y="516" font-size="12" font-weight="400" fill="#55655c" text-anchor="end" direction="ltr">enums copied from the API</text><line x1="740" y1="530" x2="1450" y2="530" stroke="#b7c6bd"/><rect x="860" y="620" width="470" height="90" rx="10" fill="#e7f2eb" stroke="#1f6b48" stroke-width="1.4"/><text x="1095" y="660.6125000000001" font-size="13.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="ltr">NestJS API (same endpoints as the web)</text><text x="1095" y="678.8375000000001" font-size="13.5" font-weight="600" fill="#1b2a22" text-anchor="middle" direction="rtl">نفس الواجهة البرمجية — لا يمر عبر Next.js</text><path d="M1095,548 L1095,620" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><path d="M670,300 L700,300 L700,665 L860,665" fill="none" stroke="#1f6b48" stroke-width="1.6" marker-end="url(#arrowGreen)"/><rect x="1083.92" y="567.7" width="172.16000000000003" height="34.6" rx="5" fill="#ffffff" stroke="none" opacity="0.96"/><text x="1170" y="581.7" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">REST + JSON over Wi-Fi/LAN</text><text x="1170" y="596" font-size="11" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">Bearer JWT</text><text x="750" y="790" font-size="12.5" font-weight="400" fill="#55655c" text-anchor="middle" direction="ltr">Donor app only: browse, donate on every path, notifications, my donations. Staff and the Mukhi use the web (the Mukhi as an installable PWA).</text>
