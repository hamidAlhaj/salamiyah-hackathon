<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d2a">
<title>لا يوجد اتصال | مجلس فند</title>
<style>
  /* The light and dark tokens of globals.css; no external files so it works fully offline. */
  :root { --page: #eef2ef; --surface: #f9fbf9; --border: #d3dcd5; --ink: #16231d; --muted: #4f5f56; --brand: #135b3c; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #0e1512; --surface: #16201b; --border: #2c3a33; --ink: #ecf2ee; --muted: #a0b0a7; --brand: #18734b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", system-ui, sans-serif; line-height: 1.75; }
  main { width: 100%; max-width: 26rem; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem 1.5rem; }
  svg { width: 64px; height: 64px; }
  h1 { font-size: 1.375rem; margin: 1rem 0 .25rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; font-weight: 500; padding: .625rem 1.25rem; border-radius: .75rem; }
  a:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <rect width="48" height="48" rx="12" fill="#0f3d2a"/>
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" opacity="0.92">
      <rect x="13" y="13" width="22" height="22" rx="1.5"/>
      <rect x="13" y="13" width="22" height="22" rx="1.5" transform="rotate(45 24 24)"/>
    </g>
    <path d="M9 25h8l2.5-5 4 10 3-7 1.5 2H39" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>لا يمكن عرض هذه الصفحة الآن. التبرعات وتأكيدات الاستلام محفوظة على خادم المجلس، وتظهر فور عودة الاتصال.</p>
  <a href="">إعادة المحاولة</a>
</main>
</body>
</html>
